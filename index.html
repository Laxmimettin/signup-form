<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Form Validation</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="signup-container">
        <div class="form-header">
            <div class="logo">✦</div>
            <h1>Create Account</h1>
            <p>Sign up to get started today.</p>
        </div>

        <form id="signupForm" novalidate>
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" autocomplete="name"
                    aria-describedby="nameError" required>
                <small class="error" id="nameError"></small>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email"
                    aria-describedby="emailError" required>
                <small class="error" id="emailError"></small>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="Create a strong password"
                        autocomplete="new-password" aria-describedby="passwordError strengthText" required>
                    <button type="button" class="toggle-password" id="togglePassword"
                        aria-label="Show password">Show</button>
                </div>

                <div class="strength-track">
                    <div id="strengthBar" class="strength-bar"></div>
                </div>
                <p id="strengthText" class="strength-text">
                    Password strength: Not entered
                </p>
                <small class="hint">
                    Use 8+ characters, uppercase, lowercase, a number and a symbol.
                </small>
                <small class="error" id="passwordError"></small>
            </div>

            <button type="submit" id="submitBtn" disabled>
                Create Account
            </button>

            <p id="successMessage" class="success" role="status"></p>
            <p class="footer-text">
                Already have an account? <span>Sign in</span>
            </p>
        </form>
    </main>

    <script src="script.js"></script>
</body>

</html>
